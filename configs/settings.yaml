# Shared-platform naming for multi-agent clusters (e.g. document discovery).
# Reserved by this stack — other agents must not reuse these for their own indexes/outputs:
#   MinIO buckets: raw-documents, redacted-documents
#   Qdrant collection: redaction-events
# Prefer sharing the same MinIO / Qdrant / Granite InferenceService with distinct names.

app:
  name: Auto Redaction Agent
  version: "1.0.0"
  environment: openshift

storage:
  # RESERVED: redaction source PDFs (MinIO bucket)
  raw_bucket: raw-documents
  # RESERVED: redaction outputs (MinIO bucket)
  redacted_bucket: redacted-documents

models:
  slm: ibm-granite/granite-3.2-8b-instruct
  embedding: BAAI/bge-small-en-v1.5
  embedding_dim: 384

redaction:
  chunk_size: 800
  chunk_overlap: 120
  event_top_k: 8
  event_score_threshold: 0.55
  burn_in: true
  fill_color: [0, 0, 0]
  # RESERVED: Qdrant collection for event chunk embeddings
  qdrant_collection: redaction-events

rhoai:
  serving_runtime: vllm
  accelerator: nvidia.com/gpu
  gpu_count: 1
  min_replicas: 1
  max_replicas: 2
