# Shared-platform naming for multi-agent clusters (e.g. document discovery).
# Reserved by this stack — other agents must not reuse these for their own indexes/outputs:
#   MinIO buckets: raw-documents, redacted-documents, vector-index
#   Vector collection prefix: redaction-events
# Models: deploy from OpenShift AI default model catalog (SLM + embedding).
# Prefer sharing MinIO + catalog InferenceServices with distinct names.

app:
  name: Auto Redaction Agent
  version: "1.0.0"
  environment: openshift

storage:
  # RESERVED: redaction source PDFs (MinIO bucket)
  raw_bucket: raw-documents
  # RESERVED: redaction outputs (MinIO bucket)
  redacted_bucket: redacted-documents
  # RESERVED: event chunk vectors (MinIO bucket — platform-first, no external vector DB)
  vector_bucket: vector-index

models:
  # Set from OpenShift AI default model catalog after deploy (GET /v1/models)
  slm: REPLACE_WITH_CATALOG_MODEL_ID
  embedding: REPLACE_WITH_CATALOG_EMBEDDING_MODEL_ID
  embedding_dim: 384

redaction:
  chunk_size: 800
  chunk_overlap: 120
  event_top_k: 8
  event_score_threshold: 0.55
  burn_in: true
  fill_color: [0, 0, 0]
  # RESERVED: collection prefix inside vector-index bucket
  vector_collection: redaction-events

rhoai:
  # SLM + embeddings come from OpenShift AI default model catalog (dashboard deploy)
  source: model-catalog
  serving_runtime: catalog-managed
  accelerator: nvidia.com/gpu
