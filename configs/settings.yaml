app:
  name: Auto Redaction Agent
  version: "1.0.0"
  environment: openshift

storage:
  raw_bucket: raw-documents
  redacted_bucket: redacted-documents

models:
  slm: ibm-granite/granite-3.2-8b-instruct
  embedding: BAAI/bge-small-en-v1.5
  embedding_dim: 384

redaction:
  chunk_size: 800
  chunk_overlap: 120
  event_top_k: 8
  event_score_threshold: 0.55
  burn_in: true
  fill_color: [0, 0, 0]

rhoai:
  serving_runtime: vllm
  accelerator: nvidia.com/gpu
  gpu_count: 1
  min_replicas: 1
  max_replicas: 2
