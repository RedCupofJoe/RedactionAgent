[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redaction-agent"
version = "1.0.0"
description = "Automated Redaction Agent for Red Hat OpenShift AI (RHOAI 3.5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Redaction Agent Team" }]
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "streamlit>=1.40.0",
  "pandas>=2.2.0",
  "pymupdf>=1.24.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "pyyaml>=6.0.2",
  "huggingface-hub>=0.26.0",
  "requests>=2.32.0",
  "mcp>=1.1.0",
  "openai>=1.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "moto[s3]>=5.0.0",
]

[project.scripts]
redaction-agent = "src.agent.core:main"
redaction-api = "src.services.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
