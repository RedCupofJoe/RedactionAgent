services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_RAW_BUCKET: raw-documents
      S3_REDACTED_BUCKET: redacted-documents
      S3_VECTOR_BUCKET: vector-index
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-local://}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-embed}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LLM_MODEL: ${LLM_MODEL:-local-model}
    ports:
      - "8000:8000"
    depends_on:
      - minio

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      AGENT_API_URL: http://agent:8000
      S3_RAW_BUCKET: raw-documents
      S3_REDACTED_BUCKET: redacted-documents
    ports:
      - "8501:8501"
    depends_on:
      - agent

  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "src.agent.mcp_gateway"]
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_VECTOR_BUCKET: vector-index
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-local://}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      MCP_SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - minio

volumes:
  minio-data:
