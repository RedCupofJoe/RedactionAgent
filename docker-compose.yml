services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_RAW_BUCKET: raw-documents
      S3_REDACTED_BUCKET: redacted-documents
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LLM_MODEL: ibm-granite/granite-3.2-8b-instruct
      LLM_API_KEY: unused
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - qdrant

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      AGENT_API_URL: http://agent:8000
      S3_RAW_BUCKET: raw-documents
      S3_REDACTED_BUCKET: redacted-documents
    ports:
      - "8501:8501"
    depends_on:
      - agent

  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "src.agent.mcp_gateway"]
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      MCP_SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - minio
      - qdrant

volumes:
  minio-data:
  qdrant-data:
