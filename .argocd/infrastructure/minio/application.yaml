apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
spec:
  project: default
  source:
    repoURL: https://github.com/RedCupofJoe/RedactionAgent.git
    targetRevision: main
    path: manifests/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Do not block the whole sync on PVC Pending (WaitForFirstConsumer needs the Deployment first)
      - RespectIgnoreDifferences=true
