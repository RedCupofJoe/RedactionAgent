apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discovery-agent
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
spec:
  project: default
  source:
    repoURL: https://github.com/RedCupofJoe/RedactionAgent.git
    targetRevision: main
    path: manifests/discovery
  destination:
    server: https://kubernetes.default.svc
    namespace: discovery-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
