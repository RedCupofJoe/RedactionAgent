apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
spec:
  project: default
  source:
    repoURL: https://github.com/EXAMPLE/RedactionAgent.git
    targetRevision: main
    path: manifests/qdrant
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
