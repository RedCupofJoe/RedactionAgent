apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-observability
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
spec:
  project: default
  source:
    repoURL: https://github.com/RedCupofJoe/RedactionAgent.git
    targetRevision: main
    path: manifests/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-observability
  # Automated sync disabled until gateway/TLS collector config is on main.
  # Manual: oc apply -k manifests/observability/
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: opentelemetry.io
      kind: OpenTelemetryCollector
      name: lab-otel
      jqPathExpressions:
        - .spec.config
