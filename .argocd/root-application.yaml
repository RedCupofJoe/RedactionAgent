apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-redaction-root
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/RedCupofJoe/RedactionAgent.git
    targetRevision: main
    path: .argocd/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
