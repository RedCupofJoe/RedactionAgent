apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: MINIO_LAB_USER
              valueFrom:
                secretKeyRef:
                  name: minio-lab-user
                  key: accessKey
                  optional: true
            - name: MINIO_LAB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-lab-user
                  key: secretKey
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p "$MC_CONFIG_DIR"
              echo "Waiting for MinIO..."
              until mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 3
              done
              for b in raw-documents redacted-documents vector-index discovery-index; do
                mc mb --ignore-existing "local/${b}"
              done
              if [ -n "${MINIO_LAB_USER:-}" ] && [ -n "${MINIO_LAB_PASSWORD:-}" ]; then
                echo "Ensuring lab user ${MINIO_LAB_USER}..."
                mc admin user add local "$MINIO_LAB_USER" "$MINIO_LAB_PASSWORD" || true
                cat >/tmp/lab-policy.json <<'JSON'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::raw-documents",
                      "arn:aws:s3:::raw-documents/*",
                      "arn:aws:s3:::redacted-documents",
                      "arn:aws:s3:::redacted-documents/*",
                      "arn:aws:s3:::vector-index",
                      "arn:aws:s3:::vector-index/*",
                      "arn:aws:s3:::discovery-index",
                      "arn:aws:s3:::discovery-index/*"
                    ]
                  }
                ]
              }
              JSON
                mc admin policy create local lab-rw /tmp/lab-policy.json || mc admin policy add local lab-rw /tmp/lab-policy.json || true
                mc admin policy attach local lab-rw --user "$MINIO_LAB_USER" || true
              fi
              mc ls local
              echo "Buckets + lab user ready."
