# Lab guidance — deploy SLM + embedding models from the OpenShift AI default catalog.
# Do not apply hand-rolled InferenceServices with custom OCI URIs for this lab.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rhoai-model-catalog-notes
  namespace: rhoai-models
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
data:
  README: |
    Deploy models from the OpenShift AI dashboard (default model catalog only):

      AI hub → Models → Catalog → Deploy model

    Required for this lab (both in project rhoai-models):
      1) Generative / instruct SLM  → used as LLM_BASE_URL / LLM_MODEL
      2) Embedding model            → used as EMBEDDING_BASE_URL / EMBEDDING_MODEL

    Prefer RawDeployment + GPU hardware profiles that match your A100 workers.

    After deploy:
      oc get inferenceservice,svc -n rhoai-models
      # LLM_BASE_URL=http://<slm>-predictor.rhoai-models.svc.cluster.local:80/v1
      # EMBEDDING_BASE_URL=http://<embed>-predictor.rhoai-models.svc.cluster.local:80/v1

    Event vectors are stored in MinIO bucket vector-index (not an external vector DB).

    See README.md Step 4.
