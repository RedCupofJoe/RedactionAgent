apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhoai-models

# SLM is deployed from the OpenShift AI default model catalog (dashboard),
# not from a custom InferenceService in this repo.
resources:
  - accelerator-profile-note.yaml
  # Apply hardware-profile-nvidia-l40s.yaml once as cluster admin (global in redhat-ods-applications).
  # Not included in kustomize build — avoids Argo ownership of a shared RHOAI CR.
