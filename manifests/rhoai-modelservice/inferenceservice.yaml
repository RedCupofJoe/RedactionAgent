apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite
  namespace: rhoai-models
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    # For RHOAI ModelMesh / KServe Raw — adjust per cluster networking
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: "oci://registry.redhat.io/rhelai1/granite-3-2-8b-instruct-fp8-nvidia-gpu@sha256:placeholder"
      # Replace storageUri with your pulled model PVC / OCI / S3 URI
      resources:
        requests:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 48Gi
          nvidia.com/gpu: "1"
    minReplicas: 1
    maxReplicas: 2
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
