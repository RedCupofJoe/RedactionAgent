apiVersion: v1
kind: ConfigMap
metadata:
  name: discovery-agent-config
  namespace: discovery-agent
data:
  S3_ENDPOINT_URL: "http://minio.minio.svc.cluster.local:9000"
  S3_RAW_BUCKET: "raw-documents"
  S3_REDACTED_BUCKET: "redacted-documents"
  S3_VECTOR_BUCKET: "vector-index"
  S3_DISCOVERY_BUCKET: "discovery-index"
  S3_SECURE: "false"
  S3_REGION: "us-east-1"
  VECTOR_COLLECTION: "redaction-events"
  DISCOVERY_COLLECTION: "discovery-events"
  # L40S-sized catalog models (set after Step 5 deploy)
  EMBEDDING_BASE_URL: "http://lab-embed-predictor.rhoai-models.svc.cluster.local:8080/v1"
  EMBEDDING_MODEL: "lab-embed"
  EMBEDDING_DIM: "384"
  LLM_BASE_URL: "http://lab-slm-predictor.rhoai-models.svc.cluster.local:8080/v1"
  LLM_MODEL: "lab-slm"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://lab-otel-collector.lab-observability.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "discovery-agent"
  OTEL_SERVICE_NAMESPACE: "discovery-agent"
  LOG_LEVEL: "INFO"
  CHUNK_SIZE: "800"
  CHUNK_OVERLAP: "120"
  EVENT_TOP_K: "8"
  EVENT_SCORE_THRESHOLD: "0.05"
