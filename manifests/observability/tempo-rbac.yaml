# Allow the lab OTEL collector to write traces into Tempo tenant "lab".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-tempo-traces-write
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["lab"]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-otel-collector-tempo-write
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-tempo-traces-write
subjects:
  - kind: ServiceAccount
    name: lab-otel-collector
    namespace: lab-observability
