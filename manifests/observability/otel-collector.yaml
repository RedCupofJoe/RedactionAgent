# Requires OpenShift Observability / OpenTelemetry Operator already installed.
# The operator creates Service lab-otel-collector for this CR.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: lab-otel
  namespace: lab-observability
  labels:
    app.kubernetes.io/part-of: auto-redaction-agent
spec:
  mode: deployment
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      # TempoMonolithic "lab" gateway (OpenShift multi-tenant). Tenant header: lab
      # Gateway requires TLS + OpenShift SA bearer token (not tls.insecure).
      otlp/tempo:
        endpoint: tempo-lab-gateway.lab-observability.svc.cluster.local:4317
        tls:
          insecure: false
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: lab
      debug:
        verbosity: basic
    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
