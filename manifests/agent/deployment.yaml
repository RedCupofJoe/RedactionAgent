apiVersion: apps/v1
kind: Deployment
metadata:
  name: redaction-agent
  namespace: redaction-agent
  labels:
    app: redaction-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redaction-agent
  template:
    metadata:
      labels:
        app: redaction-agent
    spec:
      containers:
        - name: api
          image: redaction-agent:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.services.api"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: redaction-agent-config
            - secretRef:
                name: redaction-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
